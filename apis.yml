x-spec-provenance:
  checked: '2026-09-12'
  verdict: openapi-files-are-documentation-scaffolds-not-harvested
  detail: >-
    The nine files under openapi/ (two in openapi/_original/ plus seven tag-splits of them) were not
    harvested from Guidewire. Two independent host checks prove it: their securitySchemes declare an
    OAuth 2.0 authorization server at https://login.guidewire.com/oauth/authorize and /oauth/token,
    and login.guidewire.com does not resolve (NXDOMAIN); and their servers[] use
    https://{tenant}.guidewire.com/pc/rest/v1, while Guidewire documents the request form as
    <applicationURL>/rest/<APIpath> on the customer's own Guidewire Cloud instance (guidewire.net),
    never under a /pc/rest/v1 path on guidewire.com. Guidewire also does not publish OAuth scopes at
    all — authorization is expressed as named API roles in role.yaml. The derived
    authentication/ and scopes/ artifacts that carried these invented values have been rewritten from
    Guidewire's own documentation, and the GraphQL pointers were removed because
    graphql/guidewire-graphql.md states in its own text that Guidewire has no GraphQL endpoint.
    No artifact written in this pass derives anything from openapi/. These files should be removed or
    replaced with a harvested spec in a dedicated pass.
  evidence:
  - url: https://login.guidewire.com/oauth/authorize
    status: 0
    note: DNS NXDOMAIN — host does not exist.
  - url: https://api.guidewire.com/
    status: 0
    note: DNS NXDOMAIN — the baseURL this record previously carried does not exist.
  - url: https://docs.guidewire.com/cloud/cc/202511/cloudapibf/cloudAPI/topics/101-Fund/01-overview-of-Cloud-API/c_viewing-API-definitions.html
    status: 200
    note: Guidewire's own statement of where the real definition lives.
