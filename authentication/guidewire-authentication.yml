supersedes: >-
  A derived profile written from openapi/*.yml on 2026-09-12 that reported an OAuth 2.0
  authorizationCode flow at https://login.guidewire.com/oauth/authorize and /oauth/token. That host
  does NOT RESOLVE (NXDOMAIN, checked 2026-09-12) and appears nowhere in Guidewire's documentation.
