naftiko: 1.0.0-alpha2
info:
  label: Guidewire ClaimCenter API — Claims
  description: 'Guidewire ClaimCenter API — Claims. 2 operations. Lead operation: List claims. Self-contained Naftiko capability
    covering one Guidewire business surface.'
  tags:
  - Guidewire
  - Claims
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    GUIDEWIRE_API_KEY: GUIDEWIRE_API_KEY
capability:
  consumes:
  - type: http
    namespace: claimcenter-claims
    baseUri: https://{tenant}.guidewire.com/cc/rest/v1
    description: Guidewire ClaimCenter API — Claims business capability. Self-contained, no shared references.
    resources:
    - name: claims
      path: /claims
      operations:
      - name: listclaims
        method: GET
        description: List claims
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: status
          in: query
          type: string
        - name: policyNumber
          in: query
          type: string
        - name: claimNumber
          in: query
          type: string
        - name: lossDateFrom
          in: query
          type: string
        - name: lossDateTo
          in: query
          type: string
        - name: pageSize
          in: query
          type: integer
        - name: pageNumber
          in: query
          type: integer
    - name: claims-claimId
      path: /claims/{claimId}
      operations:
      - name: getclaim
        method: GET
        description: Get claim details
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: claimId
          in: path
          type: string
          required: true
    authentication:
      type: bearer
      token: '{{env.GUIDEWIRE_API_KEY}}'
  exposes:
  - type: rest
    namespace: claimcenter-claims-rest
    port: 8080
    description: REST adapter for Guidewire ClaimCenter API — Claims. One Spectral-compliant resource per consumed operation,
      prefixed with /v1.
    resources:
    - path: /v1/claims
      name: claims
      description: REST surface for claims.
      operations:
      - method: GET
        name: listclaims
        description: List claims
        call: claimcenter-claims.listclaims
        with:
          status: rest.status
          policyNumber: rest.policyNumber
          claimNumber: rest.claimNumber
          lossDateFrom: rest.lossDateFrom
          lossDateTo: rest.lossDateTo
          pageSize: rest.pageSize
          pageNumber: rest.pageNumber
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/claims/{claimid}
      name: claims-claimid
      description: REST surface for claims-claimId.
      operations:
      - method: GET
        name: getclaim
        description: Get claim details
        call: claimcenter-claims.getclaim
        with:
          claimId: rest.claimId
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: claimcenter-claims-mcp
    port: 9090
    transport: http
    description: MCP adapter for Guidewire ClaimCenter API — Claims. One tool per consumed operation, routed inline through
      this capability's consumes block.
    tools:
    - name: list-claims
      description: List claims
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: claimcenter-claims.listclaims
      with:
        status: tools.status
        policyNumber: tools.policyNumber
        claimNumber: tools.claimNumber
        lossDateFrom: tools.lossDateFrom
        lossDateTo: tools.lossDateTo
        pageSize: tools.pageSize
        pageNumber: tools.pageNumber
      outputParameters:
      - type: object
        mapping: $.
    - name: get-claim-details
      description: Get claim details
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: claimcenter-claims.getclaim
      with:
        claimId: tools.claimId
      outputParameters:
      - type: object
        mapping: $.
