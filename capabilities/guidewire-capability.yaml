naftiko: 1.0.0-alpha2
info:
  label: Guidewire ClaimCenter API
  description: Guidewire ClaimCenter REST API for P&C insurance claims management. Provides endpoints for first notice of
    loss (FNOL), claims assignment, investigation, coverage verification, reserving, payment processing, and claims closure.
  tags:
  - Guidewire
  - API
  created: '2026-05-06'
  modified: '2026-05-06'
capability:
  consumes:
  - type: http
    namespace: guidewire
    baseUri: https://yourcompany.guidewire.com/cc/rest/v1
    description: Guidewire ClaimCenter API HTTP API.
    authentication:
      type: bearer
      token: '{{GUIDEWIRE_TOKEN}}'
    resources:
    - name: claims
      path: /claims
      operations:
      - name: listclaims
        method: GET
        description: List claims
        inputParameters:
        - name: status
          in: query
          type: string
        - name: policyNumber
          in: query
          type: string
        - name: claimNumber
          in: query
          type: string
        - name: lossDateFrom
          in: query
          type: string
        - name: lossDateTo
          in: query
          type: string
        - name: pageSize
          in: query
          type: integer
        - name: pageNumber
          in: query
          type: integer
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    - name: claims-claimid
      path: /claims/{claimId}
      operations:
      - name: getclaim
        method: GET
        description: Get claim details
        inputParameters:
        - name: claimId
          in: path
          type: string
          required: true
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    - name: fnol
      path: /fnol
      operations:
      - name: createfnol
        method: POST
        description: Submit First Notice of Loss
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    - name: claims-claimid-exposures
      path: /claims/{claimId}/exposures
      operations:
      - name: listexposures
        method: GET
        description: List claim exposures
        inputParameters:
        - name: claimId
          in: path
          type: string
          required: true
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    - name: claims-claimid-payments
      path: /claims/{claimId}/payments
      operations:
      - name: listclaimpayments
        method: GET
        description: List claim payments
        inputParameters:
        - name: claimId
          in: path
          type: string
          required: true
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
      - name: createclaimpayment
        method: POST
        description: Create claim payment
        inputParameters:
        - name: claimId
          in: path
          type: string
          required: true
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
  exposes:
  - type: rest
    port: 8080
    namespace: guidewire-rest
    description: REST adapter for Guidewire ClaimCenter API.
    resources:
    - path: /claims
      name: listclaims
      operations:
      - method: GET
        name: listclaims
        description: List claims
        call: guidewire.listclaims
        outputParameters:
        - type: object
          mapping: $.
    - path: /claims/{claimId}
      name: getclaim
      operations:
      - method: GET
        name: getclaim
        description: Get claim details
        call: guidewire.getclaim
        with:
          claimId: rest.claimId
        outputParameters:
        - type: object
          mapping: $.
    - path: /fnol
      name: createfnol
      operations:
      - method: POST
        name: createfnol
        description: Submit First Notice of Loss
        call: guidewire.createfnol
        outputParameters:
        - type: object
          mapping: $.
    - path: /claims/{claimId}/exposures
      name: listexposures
      operations:
      - method: GET
        name: listexposures
        description: List claim exposures
        call: guidewire.listexposures
        with:
          claimId: rest.claimId
        outputParameters:
        - type: object
          mapping: $.
    - path: /claims/{claimId}/payments
      name: listclaimpayments
      operations:
      - method: GET
        name: listclaimpayments
        description: List claim payments
        call: guidewire.listclaimpayments
        with:
          claimId: rest.claimId
        outputParameters:
        - type: object
          mapping: $.
    - path: /claims/{claimId}/payments
      name: createclaimpayment
      operations:
      - method: POST
        name: createclaimpayment
        description: Create claim payment
        call: guidewire.createclaimpayment
        with:
          claimId: rest.claimId
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    port: 9090
    namespace: guidewire-mcp
    transport: http
    description: MCP adapter for Guidewire ClaimCenter API for AI agent use.
    tools:
    - name: listclaims
      description: List claims
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: guidewire.listclaims
      with:
        status: tools.status
        policyNumber: tools.policyNumber
        claimNumber: tools.claimNumber
        lossDateFrom: tools.lossDateFrom
        lossDateTo: tools.lossDateTo
        pageSize: tools.pageSize
        pageNumber: tools.pageNumber
      inputParameters:
      - name: status
        type: string
        description: status
      - name: policyNumber
        type: string
        description: policyNumber
      - name: claimNumber
        type: string
        description: claimNumber
      - name: lossDateFrom
        type: string
        description: lossDateFrom
      - name: lossDateTo
        type: string
        description: lossDateTo
      - name: pageSize
        type: integer
        description: pageSize
      - name: pageNumber
        type: integer
        description: pageNumber
      outputParameters:
      - type: object
        mapping: $.
    - name: getclaim
      description: Get claim details
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: guidewire.getclaim
      with:
        claimId: tools.claimId
      inputParameters:
      - name: claimId
        type: string
        description: claimId
        required: true
      outputParameters:
      - type: object
        mapping: $.
    - name: createfnol
      description: Submit First Notice of Loss
      hints:
        readOnly: false
        destructive: false
        idempotent: false
      call: guidewire.createfnol
      outputParameters:
      - type: object
        mapping: $.
    - name: listexposures
      description: List claim exposures
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: guidewire.listexposures
      with:
        claimId: tools.claimId
      inputParameters:
      - name: claimId
        type: string
        description: claimId
        required: true
      outputParameters:
      - type: object
        mapping: $.
    - name: listclaimpayments
      description: List claim payments
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: guidewire.listclaimpayments
      with:
        claimId: tools.claimId
      inputParameters:
      - name: claimId
        type: string
        description: claimId
        required: true
      outputParameters:
      - type: object
        mapping: $.
    - name: createclaimpayment
      description: Create claim payment
      hints:
        readOnly: false
        destructive: false
        idempotent: false
      call: guidewire.createclaimpayment
      with:
        claimId: tools.claimId
      inputParameters:
      - name: claimId
        type: string
        description: claimId
        required: true
      outputParameters:
      - type: object
        mapping: $.
binds:
- namespace: env
  keys:
    GUIDEWIRE_TOKEN: GUIDEWIRE_TOKEN
