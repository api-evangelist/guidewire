specification: FinOps Framework
specificationVersion: '1.0'
schema: https://www.finops.org/framework/
alignedWith:
  framework: FinOps Foundation Framework
  frameworkUrl: https://www.finops.org/framework/
  dataSpec: FOCUS
  dataSpecVersion: '1.3'
  dataSpecUrl: https://focus.finops.org/focus-specification/v1-3/
provider: guidewire
providerId: guidewire
publisherName: Guidewire Software, Inc.
serviceCategory: Insurance Platform / SaaS
created: '2026-05-04'
modified: '2026-05-05'
reconciled: false
tags:
  - Insurance
  - P&C
  - Policy
  - Claims
  - Billing
  - FinOps
  - Cost Management
  - FOCUS
description: 'FOCUS-aligned FinOps placeholder for Guidewire InsuranceSuite Cloud: enterprise
  subscription bundled with Guidewire Cloud, no public pricing. Meters here describe likely
  invoice-line shapes (subscription seats, transaction volume, environment count) for a P&C carrier
  consuming Guidewire APIs.'
notes: Pricing model is not publicly disclosed; meters are inferred from Guidewire Cloud public
  marketing and typical enterprise SaaS billing shapes. Reconcile against the customer's MSA.
sources:
  - https://www.guidewire.com/products
  - https://www.guidewire.com/developers
principles:
  - name: Visibility
    description: Use the Guidewire Cloud Console usage views and integration logs to track per-API
      call volume against contract entitlements.
  - name: Allocation
    description: Tag InsuranceSuite environments (Dev / QA / Prod / DR) and consuming applications
      so spend can be split across business lines (Personal / Commercial / Specialty).
  - name: Optimization
    description: Right-size non-production Guidewire environments; consolidate downstream
      integrations through the Integration Gateway to reduce per-environment overhead.
  - name: Accountability
    description: Designate a Guidewire program owner; review subscription utilization quarterly
      against the contractual ramp.
domains:
  - name: Understand Usage and Cost
    capabilities:
      - Data Ingestion
      - Allocation
      - Reporting and Analytics
      - Anomaly Management
  - name: Quantify Business Value
    capabilities:
      - Planning and Estimating
      - Forecasting
      - Budgeting
      - Benchmarking
      - Unit Economics
  - name: Optimize Usage and Cost
    capabilities:
      - Architecting for Cloud
      - Rate Optimization
      - Workload Optimization
      - Cloud Sustainability
      - Licensing and SaaS
  - name: Manage the FinOps Practice
    capabilities:
      - FinOps Practice Operations
      - FinOps Education and Enablement
      - Invoicing and Chargeback
      - Onboarding Workloads
      - Intersecting Disciplines
billingModel:
  pricingCategory: Subscription
  billingFrequency: Annual
  billingCurrency: USD
  chargeCategories:
    - Purchase
    - Tax
    - Credit
    - Adjustment
  chargeFrequency: Recurring
focusColumns:
  ServiceName: Guidewire InsuranceSuite Cloud
  ServiceCategory: Insurance Platform / SaaS
  ProviderName: Guidewire
  PublisherName: Guidewire Software, Inc.
  InvoiceIssuerName: Guidewire Software, Inc.
  PricingCategory: Subscription
  PricingUnit: subscription
  BillingCurrency: USD
  ChargeCategory: Purchase
meters:
  - name: insurancesuite_subscription
    description: Annual Guidewire Cloud InsuranceSuite subscription line
    unit: subscription-year
    aggregation: sum
    dimensions:
      - environment
      - line_of_business
  - name: api_transactions
    description: Inferred transaction volume across PolicyCenter / ClaimCenter / BillingCenter
      APIs (capacity allocation meter; see contract for billable thresholds)
    unit: transaction
    aggregation: sum
    dimensions:
      - api
      - environment
  - name: integration_gateway_messages
    description: Messages flowing through the Integration Gateway (used for capacity allocation)
    unit: message
    aggregation: sum
    dimensions:
      - integration
      - environment
apis:
  - name: Guidewire PolicyCenter API
    baseURL: https://api.guidewire.com
    tags:
