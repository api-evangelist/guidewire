  - name: Guidewire Integration Gateway API
    baseURL: https://api.guidewire.com
    tags:
      - Insurance
      - Integration
      - Middleware
      - P&C
    serviceName: Guidewire Integration Gateway API
    serviceCategory: API
unitEconomics:
