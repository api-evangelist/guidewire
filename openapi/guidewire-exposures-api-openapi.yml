openapi: 3.1.0
info:
  title: Guidewire ClaimCenter Accounts Exposures API
  description: Guidewire ClaimCenter REST API for P&C insurance claims management. Provides endpoints for first notice of loss (FNOL), claims assignment, investigation, coverage verification, reserving, payment processing, and claims closure.
  version: 1.0.0
  contact:
    name: Guidewire Developer Support
    url: https://community.guidewire.com/
  license:
    name: Guidewire License
    url: https://www.guidewire.com/
servers:
- url: https://{tenant}.guidewire.com/cc/rest/v1
  variables:
    tenant:
      default: yourcompany
      description: Your Guidewire Cloud tenant identifier
security:
- OAuth2: []
tags:
- name: Exposures
  description: Claim exposure management
paths:
  /claims/{claimId}/exposures:
    get:
      operationId: listExposures
      summary: List claim exposures
      description: Returns all exposures (coverage lines being investigated) for a claim.
      tags:
      - Exposures
      parameters:
      - name: claimId
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Exposures returned
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExposureList'
components:
  schemas:
    Exposure:
      type: object
      properties:
        id:
          type: string
        coverageType:
          type: string
        claimant:
          type: object
          properties:
            id:
              type: string
            displayName:
              type: string
        status:
          type: string
          enum:
          - Open
          - Closed
        reserve:
          type: number
          format: double
        paid:
          type: number
          format: double
        incurred:
          type: number
          format: double
    ExposureList:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/Exposure'
  securitySchemes:
    OAuth2:
      type: oauth2
      flows:
        authorizationCode:
          authorizationUrl: https://login.guidewire.com/oauth/authorize
          tokenUrl: https://login.guidewire.com/oauth/token
          scopes:
            cc.claims.read: Read claim data
            cc.claims.write: Create and update claims
            cc.payments.write: Create claim payments
externalDocs:
  description: Guidewire ClaimCenter Documentation
  url: https://docs.guidewire.com/
