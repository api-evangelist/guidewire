openapi: 3.1.0
info:
  title: Guidewire ClaimCenter Accounts FNOL API
  description: Guidewire ClaimCenter REST API for P&C insurance claims management. Provides endpoints for first notice of loss (FNOL), claims assignment, investigation, coverage verification, reserving, payment processing, and claims closure.
  version: 1.0.0
  contact:
    name: Guidewire Developer Support
    url: https://community.guidewire.com/
  license:
    name: Guidewire License
    url: https://www.guidewire.com/
servers:
- url: https://{tenant}.guidewire.com/cc/rest/v1
  variables:
    tenant:
      default: yourcompany
      description: Your Guidewire Cloud tenant identifier
security:
- OAuth2: []
tags:
- name: FNOL
  description: First Notice of Loss intake
paths:
  /fnol:
    post:
      operationId: createFnol
      summary: Submit First Notice of Loss
      description: Creates a new claim from first notice of loss data. Initiates coverage verification, assignment, and claims workflow in ClaimCenter.
      tags:
      - FNOL
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FnolRequest'
      responses:
        '201':
          description: Claim created from FNOL
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Claim'
        '400':
          description: Invalid FNOL data
        '404':
          description: Policy not found
components:
  schemas:
    Exposure:
      type: object
      properties:
        id:
          type: string
        coverageType:
          type: string
        claimant:
          type: object
          properties:
            id:
              type: string
            displayName:
              type: string
        status:
          type: string
          enum:
          - Open
          - Closed
        reserve:
          type: number
          format: double
        paid:
          type: number
          format: double
        incurred:
          type: number
          format: double
    Claim:
      type: object
      properties:
        id:
          type: string
        claimNumber:
          type: string
        status:
          type: string
          enum:
          - Open
          - Closed
          - Reopened
        lossType:
          type: string
          description: Type of loss (e.g., "AUTO", "PROPERTY", "LIABILITY")
        lossDate:
          type: string
          format: date
        lossDescription:
          type: string
        reportedDate:
          type: string
          format: date-time
        policyNumber:
          type: string
        insured:
          type: object
          properties:
            id:
              type: string
            displayName:
              type: string
        assignedAdjuster:
          type: object
          properties:
            id:
              type: string
            displayName:
              type: string
        totalIncurred:
          type: number
          format: double
          description: Total incurred losses (reserves + paid)
        totalPaid:
          type: number
          format: double
        exposures:
          type: array
          items:
            $ref: '#/components/schemas/Exposure'
        createdDate:
          type: string
          format: date-time
        closedDate:
          type: string
          format: date
    FnolRequest:
      type: object
      required:
      - policyNumber
      - lossDate
      - lossType
      properties:
        policyNumber:
          type: string
        lossDate:
          type: string
          format: date
        lossTime:
          type: string
          format: time
        lossType:
          type: string
          description: Loss type code
        lossDescription:
          type: string
          maxLength: 4000
        lossLocation:
          type: object
          properties:
            addressLine1:
              type: string
            city:
              type: string
            state:
              type: string
            postalCode:
              type: string
            country:
              type: string
        reporter:
          type: object
          properties:
            firstName:
              type: string
            lastName:
              type: string
            phone:
              type: string
            email:
              type: string
              format: email
            relationship:
              type: string
  securitySchemes:
    OAuth2:
      type: oauth2
      flows:
        authorizationCode:
          authorizationUrl: https://login.guidewire.com/oauth/authorize
          tokenUrl: https://login.guidewire.com/oauth/token
          scopes:
            cc.claims.read: Read claim data
            cc.claims.write: Create and update claims
            cc.payments.write: Create claim payments
externalDocs:
  description: Guidewire ClaimCenter Documentation
  url: https://docs.guidewire.com/
