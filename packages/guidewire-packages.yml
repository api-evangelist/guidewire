summary: >-
  Guidewire publishes NO first-party client SDK for the InsuranceSuite Cloud API on any public package
  registry. This is consistent with the product's shape: Cloud API is served by the customer's own
  deployment, each tenant's contract differs (LOB-specific endpoints are generated per customer), and
  the client libraries Guidewire does ship — the Jutro Digital Platform packages — are distributed
  through Guidewire's own gated artifact repository to licensed customers, not through npm.
  The two public packages below are real and first-party, but neither is an API client.
