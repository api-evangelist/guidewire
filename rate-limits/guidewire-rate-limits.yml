specification: API Commons Rate Limits
specificationVersion: '0.1'
schema: https://raw.githubusercontent.com/api-evangelist/interface-research/main/schema/api-commons.yml#/$defs/RateLimits
provider: guidewire
providerId: guidewire
created: '2026-05-04'
# Provenance stamped 2026-08-11: this artifact was written by the API Evangelist
# bulk sweep dated 2026-05-04, not harvested from the provider. See roadmap#35.
method: searched
modified: '2026-09-12'
probed: '2026-09-12'
limit_count: 0
search_evidence:
  - url: https://docs.guidewire.com/cloud/cc/202511/cloudapibf/cloudAPI/topics/101-Fund/07-request-headers/c_HTTP-headers.html
    status: 200
    note: >-
      Complete reference of every header Cloud API supports. It lists fourteen headers and NONE of
      them is a rate-limit header — no RateLimit-*, no X-RateLimit-*, no Retry-After contract.
  - url: https://docs.guidewire.com/cloud/cc/202511/cloudapibf/cloudAPI/topics/101-Fund/01-overview-of-Cloud-API/c_requests-and-responses.html
    status: 200
    note: The documented status-code contract names no 429 behaviour.
  - url: https://www.guidewire.com/developers/apis/cloud-apis
    status: 200
search_note: >-
  Re-searched 2026-09-12 against Guidewire's own Cloud API documentation. Guidewire publishes no
  numeric rate limits, no rate-limit response headers and no 429 contract for Cloud API. limit_count
  is 0 — an honest zero. Throttling is a property of the customer's Guidewire Cloud subscription and
  tenant configuration, not of a public API product. The Retry-After / 429 / 503 values recorded below
  are generic client guidance, NOT values Guidewire publishes; treat them as advice, not as contract.
reconciled: false
tags:
  - Insurance
  - P&C
  - Rate Limiting
  - Quotas
  - Throttling
description: Guidewire does not publish public, version-stable rate limits for its InsuranceSuite
  APIs. Throttling and quota behavior is governed by the customer's Guidewire Cloud subscription
  contract and is configured per tenant.
notes: No public rate-limit documentation could be located. Numbers below are not present —
  customers should reference their Guidewire Cloud admin console and contract for actual limits.
sources:
  - https://www.guidewire.com/products
  - https://www.guidewire.com/developers
headers:
  retryAfter: Retry-After
responseCodes:
  throttled: 429
  serviceUnavailable: 503
limits:
  - tier: enterprise
    name: Contract-defined per-tenant limit
    scope: tenant
    metric: varies
    limit: see Guidewire Cloud contract / admin console
    applies:
      - Guidewire PolicyCenter API
      - Guidewire ClaimCenter API
      - Guidewire BillingCenter API
      - Guidewire Integration Gateway API
policies:
  - name: Backoff Strategy
    description: Clients should implement exponential backoff with jitter on 429 responses and honor
      the Retry-After header where present.
  - name: Tenant Scoping
    description: Limits apply per Guidewire Cloud tenant; raises require working with the
      Guidewire account team.
  - name: Fair Use
    description: Sustained traffic above contract-defined volumes may be subject to fair-use
      throttling regardless of tenant scale.
maintainers: []
