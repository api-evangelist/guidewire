supersedes: >-
  A derived scope list written from openapi/*.yml on 2026-09-12 that reported three OAuth scopes
  (cc.claims.read, cc.claims.write, cc.payments.write) under an authorizationCode flow at
  https://login.guidewire.com/oauth/authorize. That authorization-server host does NOT RESOLVE
  (NXDOMAIN, checked 2026-09-12), the scope strings appear nowhere in Guidewire's documentation, and
  the values came from the documentation-shaped scaffold specs in openapi/ rather than from Guidewire.
  They are removed here rather than carried forward.
finding: >-
  Guidewire's InsuranceSuite Cloud API has NO OAuth 2.0 scope surface. Guidewire does not run an
  authorization server for it, publishes no scope catalog, and expresses authorization a different way
  entirely: named API roles, defined in role.yaml files and assigned to callers, which enumerate the
  endpoints, operations and fields a caller may reach. Bearer JWTs carry authorization as token claims
  interpreted against those roles.
scopes: []
equivalent_mechanism:
  name: Cloud API roles
  artifact: role.yaml files shipped and configured per deployment
  granularity: [endpoint, operation, field]
  additional_access_types:
    - endpoint access
    - resource access
    - proxy-user access
  reserved_roles_docs: https://docs.guidewire.com/cloud/is/202607/cloudapica/cloudAPI/AuthImplement/endpoint-access/c_reserved-roles.html
  assignment_docs: https://docs.guidewire.com/cloud/is/202607/cloudapica/cloudAPI/AuthImplement/endpoint-access/c_assigning-API-roles-to-callers.html
  note: >-
    Role names are defined per customer deployment, so there is no catalog-wide list to publish. This
    is why no OAuthScopes pointer is wired in apis.yml — a scope surface that does not exist should not
    be asserted on Guidewire's behalf.
other_oauth_surfaces:
  - host: community.guidewire.com
    note: >-
      Salesforce Experience Cloud OIDC for the Guidewire Community portal, with a Salesforce-standard
      scopes_supported list (openid, profile, email, api, offline_access, …). It governs portal
      sign-in, NOT Cloud API access, and its scopes are Salesforce's, not Guidewire's.
    document: well-known/guidewire-community-openid-configuration.json
